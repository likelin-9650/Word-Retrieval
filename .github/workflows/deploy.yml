# GitHub Actions 会识别此路径：.github/workflows/deploy.yml
# 当 main 分支有 push 时，SSH 到云服务器：git pull → 更新依赖 → 重启 gunicorn 服务

name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许在 Actions 页手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # 若用非 22 端口，在 Secrets 里加 SERVER_PORT，并取消下一行注释：
          # port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_DIR" ]; then
              DEPLOY_DIR="$HOME/Word-Retrieval"
            fi
            echo "==> 部署目录: $DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            echo "==> 拉取最新代码"
            git fetch origin main
            git checkout main
            git pull origin main

            echo "==> 更新 Python 依赖"
            if [ ! -d .venv ]; then
              python3 -m venv .venv
            fi
            # shellcheck disable=SC1091
            source .venv/bin/activate
            pip install -U pip
            pip install -r requirements.txt
            pip install gunicorn

            # ecdict.db 很大，日常部署不要每次重建。
            # 仅当文件不存在时构建（首次部署）：
            if [ ! -f dictionaries/ecdict.db ]; then
              echo "==> 未找到 ecdict.db，首次生成（较慢）…"
              python build_ecdict_db.py
            fi

            echo "==> 重启应用服务"
            # 需要服务器上已创建 systemd 单元 word-retrieval.service
            # 且部署用户可无无密码执行：sudo systemctl restart word-retrieval
            sudo systemctl restart word-retrieval
            sudo systemctl --no-pager --full status word-retrieval || true

            echo "==> 部署完成: $(date -R)"
