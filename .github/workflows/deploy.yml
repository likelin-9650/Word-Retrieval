# GitHub Actions：在 Runner 上 checkout，再 SCP 到服务器安装重启
# 避免服务器无法访问 github.com:443 导致 git clone/pull 超时

name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pack project (exclude venv / local db / cache)
        run: |
          # 压缩包写到 /tmp，避免 tar 打包当前目录时读到自身变化而退出码 1
          tar -czf /tmp/word-retrieval-deploy.tar.gz \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.cache' \
            --exclude='dictionaries/ecdict.db' \
            --exclude='dictionaries/ecdict.db-journal' \
            --exclude='dictionaries/dict_extra.txt' \
            --exclude='dictionaries/dict_exclude.txt' \
            --exclude='.git' \
            -C "$GITHUB_WORKSPACE" .
          cp /tmp/word-retrieval-deploy.tar.gz "$GITHUB_WORKSPACE/word-retrieval-deploy.tar.gz"

      - name: SCP package to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "word-retrieval-deploy.tar.gz"
          target: "/tmp/"
          overwrite: true

      - name: Install and restart on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 60m
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_DIR" ]; then
              DEPLOY_DIR="$HOME/Word-Retrieval"
            fi
            echo "==> 部署目录: $DEPLOY_DIR"
            mkdir -p "$DEPLOY_DIR"

            echo "==> 解压代码（保留本地 .venv 与 ecdict.db）"
            tar -xzf /tmp/word-retrieval-deploy.tar.gz -C "$DEPLOY_DIR"
            rm -f /tmp/word-retrieval-deploy.tar.gz

            cd "$DEPLOY_DIR"

            echo "==> 更新 Python 依赖（清华 PyPI 镜像）"
            PIP_MIRROR="https://pypi.tuna.tsinghua.edu.cn/simple"
            if [ ! -d .venv ]; then
              python3 -m venv .venv
            fi
            # shellcheck disable=SC1091
            source .venv/bin/activate
            pip install -U pip -i "$PIP_MIRROR"
            pip install -r requirements.txt gunicorn -i "$PIP_MIRROR"

            if [ ! -f dictionaries/ecdict.db ]; then
              echo "==> 未找到 ecdict.db"
              if python -c "import urllib.request; urllib.request.urlopen('https://github.com', timeout=8)" 2>/dev/null; then
                echo "==> 可访问 GitHub，开始构建词典…"
                python build_ecdict_db.py
              else
                echo "警告: 服务器访问 GitHub 超时，无法自动下载 ECDICT。"
                echo "请在能访问 GitHub 的机器上运行 python build_ecdict_db.py，"
                echo "再把 dictionaries/ecdict.db 上传到服务器对应目录。"
              fi
            fi

            echo "==> 重启应用服务"
            if systemctl list-unit-files | grep -q '^word-retrieval.service'; then
              sudo systemctl restart word-retrieval
              sudo systemctl --no-pager --full status word-retrieval || true
            else
              echo "警告: 未找到 word-retrieval.service，请先创建 systemd 服务"
              exit 1
            fi

            echo "==> 部署完成: $(date -R)"
