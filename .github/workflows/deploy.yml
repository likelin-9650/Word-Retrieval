# GitHub Actions 会识别此路径：.github/workflows/deploy.yml
# 当 main 分支有 push 时，SSH（用户名+密码）到云服务器：
# 必要时 clone → git pull → 更新依赖 → 重启 gunicorn 服务

name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许在 Actions 页手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          # 若用非 22 端口，在 Secrets 里加 SERVER_PORT，并取消下一行注释：
          # port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_DIR" ]; then
              DEPLOY_DIR="$HOME/Word-Retrieval"
            fi
            REPO_URL="https://github.com/likelin-9650/Word-Retrieval.git"
            echo "==> 部署目录: $DEPLOY_DIR"

            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              echo "==> 目录不存在或不是 git 仓库，正在 clone…"
              mkdir -p "$(dirname "$DEPLOY_DIR")"
              if [ -d "$DEPLOY_DIR" ] && [ ! -d "$DEPLOY_DIR/.git" ]; then
                # 空目录或非 git 目录：若为空则 clone 进去，否则报错避免误覆盖
                if [ -z "$(ls -A "$DEPLOY_DIR" 2>/dev/null || true)" ]; then
                  rmdir "$DEPLOY_DIR" 2>/dev/null || true
                else
                  echo "错误: $DEPLOY_DIR 已存在且不是 git 仓库，请清空或改 DEPLOY_PATH"
                  exit 1
                fi
              fi
              git clone "$REPO_URL" "$DEPLOY_DIR"
            fi

            cd "$DEPLOY_DIR"

            echo "==> 拉取最新代码"
            git fetch origin main
            git checkout main
            git pull origin main

            echo "==> 更新 Python 依赖"
            if [ ! -d .venv ]; then
              python3 -m venv .venv
            fi
            # shellcheck disable=SC1091
            source .venv/bin/activate
            pip install -U pip
            pip install -r requirements.txt
            pip install gunicorn

            # ecdict.db 很大，日常部署不要每次重建。
            # 仅当文件不存在时构建（首次部署）：
            if [ ! -f dictionaries/ecdict.db ]; then
              echo "==> 未找到 ecdict.db，首次生成（较慢，可能需数分钟）…"
              python build_ecdict_db.py
            fi

            echo "==> 重启应用服务"
            if systemctl list-unit-files | grep -q '^word-retrieval.service'; then
              sudo systemctl restart word-retrieval
              sudo systemctl --no-pager --full status word-retrieval || true
            else
              echo "警告: 未找到 word-retrieval.service"
              echo "请先在服务器上创建 systemd 服务后再部署，或手动用 gunicorn 启动。"
              exit 1
            fi

            echo "==> 部署完成: $(date -R)"
